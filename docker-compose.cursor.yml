# NovaFlow Cursor-safe stack (standalone) for ~16 GB RAM — no Milvus
#
# FIRST TIME:
#   .\scripts\cursor-stack-build.ps1
#
# BACKEND ONLY (bind mount — no image rebuild):
#   docker compose -f docker-compose.cursor.yml restart api
#
# FRONTEND ONLY:
#   .\scripts\rebuild-web-safe.ps1
#
# START (no rebuild):
#   .\scripts\cursor-stack-up.ps1
#
# Web http://localhost:3000  API http://localhost:3001
# Default login: admin / NovaFlowLocalDevAdmin1

name: novaflow

services:
  mysql:
    image: mysql:8.0
    container_name: novaflow-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --table-open-cache=200
      - --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: novaflow
      MYSQL_DATABASE: novaflow
      MYSQL_USER: novaflow
      MYSQL_PASSWORD: novaflow
      TZ: UTC
    volumes:
      - novaflow_mysql:/var/lib/mysql
    mem_limit: 640m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pnovaflow"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: novaflow-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    mem_limit: 64m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: novaflow-api:latest
    pull_policy: never
    user: root
    container_name: novaflow-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NOVAFLOW_PORT: "3001"
      NOVAFLOW_ENV: development
      DATABASE_URL: mysql+pymysql://novaflow:novaflow@mysql:3306/novaflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: novaflow-local-dev-secret-change-before-prod
      ACCESS_TOKEN_MINUTES: "15"
      REFRESH_TOKEN_DAYS: "14"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      DATA_DIR: /app/data
      NOVAFLOW_DEMO_SEED: "0"
      NOVAFLOW_ADMIN_USER: admin
      NOVAFLOW_ADMIN_PASSWORD: NovaFlowLocalDevAdmin1
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""

      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      OPENAI_MODEL: openai/gpt-4o-mini
      MILVUS_URI: ""
      SSRF_ALLOW_PRIVATE: "0"

      UNIVERSAL_CHAT_ENABLED: "1"
      COMPONENT_DIR: /app/components
      ENABLE_DYNAMIC_COMPONENT_CREATION: "1"
      ENABLE_API_REQUIREMENT_GATHERING: "1"
      ENABLE_LLM_GRAPH_COMPOSE: "1"
      ENABLE_CONVERSATION_API_KEYS: "1"
      USER_API_KEY_REQUIRED: "0"
      DEFAULT_USER_ROLE: admin
      DEFAULT_USER_PROVIDER: openrouter
      DEFAULT_USER_MODEL: openai/gpt-4o-mini
      OPENROUTER_API_KEY: ""
      GMAIL_ONLY_AUTH: "0"
      STRICT_SECURITY_MODE: "0"
      ENFORCE_GMAIL_ONLY: "0"
      REQUIRE_USER_API_KEYS: "0"
      ALLOW_PASSWORD_LOGIN: "1"
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NOVAFLOW_PUBLIC_BASE_URL: ${NOVAFLOW_PUBLIC_BASE_URL:-}
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts:ro
      - novaflow_data:/app/data
      - novaflow_components:/app/components
    mem_limit: 768m
    cpus: "1.0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
        NEXT_PUBLIC_APP_NAME: NovaFlow AI
        NEXT_PUBLIC_UNIVERSAL_CHAT_ENABLED: "true"
    image: novaflow-web:local
    pull_policy: build
    container_name: novaflow-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      API_INTERNAL_URL: http://api:3001
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_UNIVERSAL_CHAT_ENABLED: "true"
    mem_limit: 384m
    cpus: "0.75"
    depends_on:
      api:
        condition: service_healthy

volumes:
  novaflow_mysql:
  novaflow_data:
  novaflow_components:
