services:
  mysql:
    image: mysql:8.0
    container_name: novaflow-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: novaflow
      MYSQL_DATABASE: novaflow
      MYSQL_USER: novaflow
      MYSQL_PASSWORD: novaflow
      TZ: UTC
    volumes:
      - novaflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pnovaflow"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: novaflow-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: novaflow-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    # No host port — API reaches milvus:19530 on the Docker network (avoids clash with bisheng on 19530)
    volumes:
      - novaflow_milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: novaflow-api:latest
    user: root
    container_name: novaflow-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NOVAFLOW_PORT: "3001"
      NOVAFLOW_ENV: ${NOVAFLOW_ENV:-development}
      NOVAFLOW_ADMIN_PASSWORD: ${NOVAFLOW_ADMIN_PASSWORD:-NovaFlowLocalDevAdmin1}
      DATABASE_URL: mysql+pymysql://novaflow:novaflow@mysql:3306/novaflow
      STRICT_SECURITY_MODE: ${STRICT_SECURITY_MODE:-0}
      ENFORCE_GMAIL_ONLY: ${ENFORCE_GMAIL_ONLY:-0}
      REQUIRE_USER_API_KEYS: ${REQUIRE_USER_API_KEYS:-0}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-NovaFlowSecureJWTSecret2024ProductionGradeSecurity!}
      ACCESS_TOKEN_MINUTES: "15"
      REFRESH_TOKEN_DAYS: "14"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      DATA_DIR: /app/data
      NOVAFLOW_DEMO_SEED: "0"
      NOVAFLOW_ADMIN_USER: admin
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-4o-mini}
      MILVUS_URI: http://milvus:19530
      SSRF_ALLOW_PRIVATE: "0"

      # Google OAuth (required for Gmail sign-in)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # ngrok / public tunnel — set by scripts/start-with-ngrok.* or .env
      NOVAFLOW_PUBLIC_BASE_URL: ${NOVAFLOW_PUBLIC_BASE_URL:-}
      ALLOW_PASSWORD_LOGIN: ${ALLOW_PASSWORD_LOGIN:-1}
      
      # Universal AI Chat System Configuration
      UNIVERSAL_CHAT_ENABLED: "1"
      COMPONENT_DIR: /app/components
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      USER_API_KEY_REQUIRED: ${USER_API_KEY_REQUIRED:-0}
      ENABLE_DYNAMIC_COMPONENT_CREATION: "1"
      ENABLE_API_REQUIREMENT_GATHERING: "1"
      ENABLE_LLM_GRAPH_COMPOSE: "1"
      GMAIL_ONLY_AUTH: ${GMAIL_ONLY_AUTH:-0}
      
      # Ensure global chat uses user-provided API keys
      ENABLE_CONVERSATION_API_KEYS: "1"
      
      # User Role Management & API Key System
      DEFAULT_USER_ROLE: "admin"
      DEFAULT_USER_PROVIDER: "openrouter"
      DEFAULT_USER_MODEL: "openai/gpt-4o-mini"
    volumes:
      - ../backend/app:/app/app
      - ../backend/scripts:/app/scripts:ro
      - novaflow_data:/app/data
      - novaflow_components:/app/components
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

volumes:
  novaflow_mysql:
  novaflow_data:
  novaflow_milvus:
  novaflow_components:
