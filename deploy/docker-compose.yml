services:
  mysql:
    image: mysql:8.0
    container_name: novaflow-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: novaflow
      MYSQL_DATABASE: novaflow
      MYSQL_USER: novaflow
      MYSQL_PASSWORD: novaflow
      TZ: UTC
    volumes:
      - novaflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pnovaflow"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: novaflow-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: novaflow-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    # No host port — API reaches milvus:19530 on the Docker network (avoids clash with bisheng on 19530)
    volumes:
      - novaflow_milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: novaflow-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NOVAFLOW_PORT: "3001"
      NOVAFLOW_ENV: ${NOVAFLOW_ENV:-development}
      DATABASE_URL: mysql+pymysql://novaflow:novaflow@mysql:3306/novaflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-novaflow-local-dev-secret-change-before-prod}
      ACCESS_TOKEN_MINUTES: "15"
      REFRESH_TOKEN_DAYS: "14"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      DATA_DIR: /app/data
      NOVAFLOW_ADMIN_USER: admin
      NOVAFLOW_ADMIN_PASSWORD: ${NOVAFLOW_ADMIN_PASSWORD:-admin123}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MILVUS_URI: http://milvus:19530
      SSRF_ALLOW_PRIVATE: "0"
    volumes:
      - novaflow_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

volumes:
  novaflow_mysql:
  novaflow_data:
  novaflow_milvus:
