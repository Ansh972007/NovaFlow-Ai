# NovaFlow full stack — web + API + MySQL + Redis + Milvus
#
# One command (builds web + API images inside Docker):
#   docker compose up -d --build
#
# With Telegram / ngrok (start tunnel first, then Docker):
#   scripts\start-with-ngrok.cmd
#   scripts\start-with-ngrok.cmd -ComposeFile docker-compose.cursor.yml
#
# Low RAM / no Milvus (~16 GB):
#   docker compose -f docker-compose.cursor.yml up -d --build
#
# Web http://localhost:3000 · API http://localhost:3001
# Login: admin / NovaFlowLocalDevAdmin1

name: novaflow

include:
  - path: deploy/docker-compose.yml

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
        NEXT_PUBLIC_APP_NAME: NovaFlow AI
        NEXT_PUBLIC_UNIVERSAL_CHAT_ENABLED: "true"
    image: novaflow-web:local
    pull_policy: build
    container_name: novaflow-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      API_INTERNAL_URL: http://api:3001
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_UNIVERSAL_CHAT_ENABLED: "true"
    mem_limit: 512m
    depends_on:
      api:
        condition: service_healthy
